# TUA Load Control — https://akbulut.com.tm/load
#
# Paste these three locations INSIDE the existing `server { ... }` block that
# already holds `server_name akbulut.com.tm www.akbulut.com.tm;` — the one
# with the Sectigo certificate at /etc/ssl/akbulut/ssl.crt. Nothing is
# replaced; the main site keeps serving everything outside /load.
#
# A sub-domain (load.akbulut.com.tm) would not need a prefix at all, but
# akbulut.com.tm's DNS is held at Turkmentelecom (webns1/webns2.telecom.tm)
# and the operator cannot add records to it. Hence the sub-path.
#
# The app is built with NEXT_PUBLIC_BASE_PATH=/load, so every URL it emits —
# pages, /_next/static assets, the Auth.js routes, its own 308s — carries
# the prefix. That is why proxy_pass has NO trailing slash: the prefix must
# reach the app intact. Stripping it (proxy_pass http://127.0.0.1:3000/)
# renders pages while every asset 404s.

# Bare /load is the URL people will bookmark, and Next answers it 404: with a
# basePath set it has no route for the mount point itself, and /load/ just
# 308s back here. Both are sent to the default locale — "en", with
# localeDetection off (see src/i18n/routing.ts), so this is the same landing
# the app would choose. Exact-match locations, so they win over the prefix
# block below regardless of order.
location = /load  { return 301 https://$host/load/en; }
location = /load/ { return 301 https://$host/load/en; }

# ^~ is not decoration: it stops nginx evaluating this server block's regex
# locations once the prefix matches. Without it a `location ~* \.(js|css)$`
# rule in the main site's config would intercept /load/_next/static/*.js and
# try to serve it as a file from the Laravel document root.
location ^~ /load {
    # Credentials cross this path and the surrounding block answers on both
    # 80 and 443, so plain HTTP has to be turned away explicitly.
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Auth.js builds callback URLs from these and decides whether the session
    # cookie may be Secure. Without X-Forwarded-Proto the login POST succeeds
    # and every request after it looks unauthenticated.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # No Upgrade/Connection pair: a production Next server speaks no
    # WebSocket (that is dev-mode HMR), so forwarding them would mean
    # defining a $connection_upgrade map at http level for nothing.

    # Document generation (LIR/Loadsheet/CG Envelope) renders inside the
    # request on a 2-core VM; nginx's 60s default cuts the slowest ones off
    # mid-render and the operator sees a 504 on a document that was fine.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # AHM 560 PDF upload (/load/api/admin/ahm/validate).
    client_max_body_size 32m;

    # Next streams RSC payloads; buffering them whole adds latency to every
    # navigation for no gain at this traffic level.
    proxy_buffering off;

    # Scoped to this location — the main site's headers are not this
    # config's business.
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-Frame-Options        "DENY"        always;
    add_header Referrer-Policy        "same-origin" always;
}
