services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tua
      POSTGRES_PASSWORD: tua_dev_password
      POSTGRES_DB: tua_load_control
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tua -d tua_load_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://tua:tua_dev_password@postgres:5432/tua_load_control?schema=public"
      AUTH_SECRET: "dev-only-secret-change-in-production"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      DOCUMENTS_WATERMARK: "true"
      NEXT_PUBLIC_DEFAULT_LOCALE: "tk"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
