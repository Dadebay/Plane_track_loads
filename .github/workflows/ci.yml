name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tua
          POSTGRES_PASSWORD: tua_test_password
          POSTGRES_DB: tua_load_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://tua:tua_test_password@localhost:5432/tua_load_control_test?schema=public"
      AUTH_SECRET: "ci-secret"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      DOCUMENTS_WATERMARK: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm --filter @tua/db exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
